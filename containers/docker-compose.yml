# Structurizr DevOps - Simplified Local Stack
# =============================================================================
# Primary usage: On-Premises only (promotion target)
# Lite instances: On-demand via ./scripts/lite.sh or profile
#
# Start On-Premises:   nerdctl compose up -d
# Start with Lite:     nerdctl compose --profile lite up -d
# Stop:                nerdctl compose down
# =============================================================================

services:
  # =============================================================================
  # Structurizr On-Premises (Promotion Target) - Always Running
  # =============================================================================
  # Central repository where all workspaces are promoted to.
  # Access at: http://localhost:20000
  structurizr-onpremises:
    image: structurizr/onpremises:latest
    container_name: structurizr-onpremises
    ports:
      - "20000:8080"
    volumes:
      - ./onpremises/structurizr.properties:/usr/local/structurizr/structurizr.properties:ro
      - structurizr-data:/usr/local/structurizr/data
    environment:
      - JAVA_OPTS=-Xmx512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # =============================================================================
  # Structurizr Lite (Optional - On-Demand Visual Editor)
  # =============================================================================
  # Single Lite instance for visual editing when needed.
  # By default, points to the current quarter's platform domain.
  # For other workspaces, use ./scripts/lite.sh instead.
  #
  # Start with: nerdctl compose --profile lite up -d structurizr-lite
  # Access at: http://localhost:20100
  structurizr-lite:
    image: structurizr/lite:latest
    container_name: structurizr-lite
    profiles:
      - lite
    ports:
      - "20100:8080"
    volumes:
      - ../workspaces/current/domains/platform:/usr/local/structurizr:rw
    environment:
      - STRUCTURIZR_WORKSPACE_FILENAME=workspace.dsl
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  structurizr-data:
    name: structurizr-onpremises-data

# =============================================================================
# Quick Reference
# =============================================================================
# For on-demand editing of specific workspaces, use the lite.sh script:
#
#   ./scripts/lite.sh platform              # Edit platform domain (current quarter)
#   ./scripts/lite.sh orders                # Edit orders domain
#   ./scripts/lite.sh executive perspective # Edit executive perspective
#   ./scripts/lite.sh platform q1-2025      # Edit archived quarter
#
# This avoids running 7 Lite containers simultaneously.
# =============================================================================
