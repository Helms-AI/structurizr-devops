# =============================================================================
# Domain Registry - Catalog of Business Domains
# =============================================================================
# This file defines all business domains in the architecture, their metadata,
# and configuration for the DevOps pipeline.
#
# Adding a new domain:
#   1. Add entry below with required fields
#   2. Create workspace directory: workspaces/current/domains/{name}/
#   3. Run: ./cli workspace:create {name} (optional scaffolding)
#   4. Configure GitHub secrets for the domain
#
# Workspace IDs:
#   Each domain/perspective maps to a single workspace ID on Structurizr
#   On-Premises, with branches per quarter:
#   - main branch: current quarter (via workspaces/current/)
#   - quarter branches: archived quarters (via workspaces/{quarter}/)
# =============================================================================

# Current active quarter
current_quarter: q2-2025

domains:
  # ---------------------------------------------------------------------------
  # Platform Domain - Core Infrastructure
  # ---------------------------------------------------------------------------
  platform:
    name: Platform Domain
    description: Core platform infrastructure and shared services
    owner: Platform Team
    workspace_id: 1
    port: 20100
    workspace_file: workspace.dsl
    color: "#1168bd"
    tags:
      - infrastructure
      - core
    dependencies: []

  # ---------------------------------------------------------------------------
  # Orders Domain - Order Management
  # ---------------------------------------------------------------------------
  orders:
    name: Orders Domain
    description: Order management and fulfillment business domain
    owner: Commerce Team
    workspace_id: 3
    port: 20101
    workspace_file: workspace.dsl
    color: "#2e7d32"
    tags:
      - commerce
      - transactions
    dependencies:
      - platform

  # ---------------------------------------------------------------------------
  # Notifications Domain - Messaging
  # ---------------------------------------------------------------------------
  notifications:
    name: Notifications Domain
    description: Notification and messaging business domain
    owner: Engagement Team
    workspace_id: 5
    port: 20102
    workspace_file: workspace.dsl
    color: "#7b1fa2"
    tags:
      - messaging
      - engagement
    dependencies:
      - platform

# =============================================================================
# Perspectives - Stakeholder Views
# =============================================================================
# These aggregate multiple domains into stakeholder-specific views

perspectives:
  executive:
    name: Executive Dashboard
    description: High-level business architecture view for leadership
    workspace_id: 10
    port: 20200
    includes:
      - platform
      - orders
      - notifications

  security:
    name: Security Architecture
    description: Security-focused view showing trust boundaries and data flows
    workspace_id: 11
    port: 20201
    includes:
      - platform
      - orders
      - notifications

  technical:
    name: Technical Architecture
    description: Developer-focused view with implementation details
    workspace_id: 12
    port: 20202
    includes:
      - platform
      - orders
      - notifications

# =============================================================================
# Port Scheme
# =============================================================================
# On-Premises:    20000
# Domains:        20100-20199
# Perspectives:   20200-20299
# Reserved:       20300-20399 (future use)

# =============================================================================
# Workspace ID Mapping
# =============================================================================
# | Domain/Perspective | Workspace ID | Branches              |
# |--------------------|--------------|------------------------|
# | platform           | 1            | main, q1-2025, q2-2025 |
# | orders             | 3            | main, q1-2025, q2-2025 |
# | notifications      | 5            | main, q1-2025, q2-2025 |
# | executive          | 10           | main, q1-2025, q2-2025 |
# | security           | 11           | main, q1-2025, q2-2025 |
# | technical          | 12           | main, q1-2025, q2-2025 |
