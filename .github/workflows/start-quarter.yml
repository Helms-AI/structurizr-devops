# =============================================================================
# Start New Quarter
# =============================================================================
# Initializes a new quarter by creating the appropriate git branches:
#   1. Creates release/{quarter} branch from specified base
#   2. Optionally merges any existing planning branch
#   3. Creates a planning branch for the following quarter
#
# Branch Strategy:
#   - release/q2-2025     : Current quarter development
#   - planning/q3-2025    : Future quarter planning (isolated)
#   - main                : Always reflects latest promoted architecture
#
# Usage:
#   - Run at the start of each quarter after snapshot is taken
#   - Ensures clean rollover with optional planning merge
# =============================================================================
name: Start New Quarter

on:
  workflow_dispatch:
    inputs:
      new_quarter:
        description: 'New quarter (e.g., q2-2025)'
        required: true
        type: string
      base_branch:
        description: 'Base branch to create from (default: main)'
        required: false
        type: string
        default: 'main'
      merge_planning:
        description: 'Merge existing planning branch if exists'
        required: false
        type: boolean
        default: true
      create_next_planning:
        description: 'Create planning branch for next quarter'
        required: false
        type: boolean
        default: true
      next_quarter:
        description: 'Next quarter for planning branch (e.g., q3-2025)'
        required: false
        type: string

jobs:
  # ===========================================================================
  # Create New Quarter Release Branch
  # ===========================================================================
  create-release-branch:
    name: Create Release Branch
    runs-on: [self-hosted, structurizr, nerdctl]
    outputs:
      branch_created: ${{ steps.create.outputs.branch_created }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.base_branch }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create release branch
        id: create
        run: |
          BRANCH_NAME="release/${{ inputs.new_quarter }}"

          # Check if branch already exists
          if git ls-remote --exit-code --heads origin "$BRANCH_NAME" >/dev/null 2>&1; then
            echo "⚠️  Branch $BRANCH_NAME already exists"
            echo "branch_created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Creating branch: $BRANCH_NAME from ${{ inputs.base_branch }}"
          git checkout -b "$BRANCH_NAME"
          git push -u origin "$BRANCH_NAME"

          echo "✅ Release branch created: $BRANCH_NAME"
          echo "branch_created=true" >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # Merge Planning Branch (if exists)
  # ===========================================================================
  merge-planning:
    name: Merge Planning Branch
    needs: create-release-branch
    if: ${{ inputs.merge_planning && needs.create-release-branch.outputs.branch_created == 'true' }}
    runs-on: [self-hosted, structurizr, nerdctl]
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/${{ inputs.new_quarter }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge planning branch if exists
        run: |
          PLANNING_BRANCH="planning/${{ inputs.new_quarter }}"

          # Check if planning branch exists
          if git ls-remote --exit-code --heads origin "$PLANNING_BRANCH" >/dev/null 2>&1; then
            echo "Found planning branch: $PLANNING_BRANCH"
            git fetch origin "$PLANNING_BRANCH"
            git merge "origin/$PLANNING_BRANCH" -m "Merge ${{ inputs.new_quarter }} planning into release"
            git push origin "release/${{ inputs.new_quarter }}"
            echo "✅ Planning branch merged successfully"
          else
            echo "ℹ️  No planning branch found: $PLANNING_BRANCH"
            echo "   Skipping merge step"
          fi

  # ===========================================================================
  # Create Next Quarter Planning Branch
  # ===========================================================================
  create-planning-branch:
    name: Create Planning Branch
    needs: [create-release-branch, merge-planning]
    if: ${{ always() && inputs.create_next_planning && inputs.next_quarter != '' }}
    runs-on: [self-hosted, structurizr, nerdctl]
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/${{ inputs.new_quarter }}
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create planning branch
        run: |
          PLANNING_BRANCH="planning/${{ inputs.next_quarter }}"

          # Check if branch already exists
          if git ls-remote --exit-code --heads origin "$PLANNING_BRANCH" >/dev/null 2>&1; then
            echo "⚠️  Planning branch $PLANNING_BRANCH already exists"
            exit 0
          fi

          echo "Creating planning branch: $PLANNING_BRANCH"
          git checkout -b "$PLANNING_BRANCH"
          git push -u origin "$PLANNING_BRANCH"

          echo "✅ Planning branch created: $PLANNING_BRANCH"

  # ===========================================================================
  # Summary
  # ===========================================================================
  summary:
    name: Quarter Setup Summary
    needs: [create-release-branch, merge-planning, create-planning-branch]
    if: always()
    runs-on: [self-hosted, structurizr, nerdctl]
    steps:
      - name: Print summary
        run: |
          echo "=============================================="
          echo "New Quarter Setup Complete: ${{ inputs.new_quarter }}"
          echo "=============================================="
          echo ""
          echo "Branch Structure:"
          echo "  📦 release/${{ inputs.new_quarter }} - Current quarter development"
          if [ -n "${{ inputs.next_quarter }}" ]; then
            echo "  🔮 planning/${{ inputs.next_quarter }} - Future quarter planning"
          fi
          echo ""
          echo "Workflow:"
          echo "  1. Develop on release/${{ inputs.new_quarter }}"
          echo "  2. PRs merge to release/${{ inputs.new_quarter }}"
          echo "  3. When ready, merge release/${{ inputs.new_quarter }} to main"
          echo "  4. At quarter end, run 'Quarterly Snapshot' workflow"
          echo ""
          echo "For future planning:"
          if [ -n "${{ inputs.next_quarter }}" ]; then
            echo "  - Work on planning/${{ inputs.next_quarter }} for isolated changes"
            echo "  - Will be merged automatically at next quarter start"
          else
            echo "  - Create planning/{next-quarter} branch manually when needed"
          fi
