# =============================================================================
# Quarterly Architecture Snapshot
# =============================================================================
# Creates an immutable snapshot of the current architecture state:
#   1. Validates all workspace DSL files
#   2. Creates a directory copy of the current quarter
#   3. Optionally creates workspace branches on Structurizr On-Premises
#   4. Creates a git tag marking the quarterly snapshot
#
# The snapshot creates:
#   - workspaces/{quarter}/ directory containing all domains and perspectives
#   - Git tag: {quarter}-final
#   - Optional: Structurizr workspace branches
#
# Usage:
#   - Run at the end of each quarter to preserve architecture state
#   - Snapshots are immutable - use for compliance and historical review
# =============================================================================
name: Quarterly Snapshot

on:
  workflow_dispatch:
    inputs:
      quarter:
        description: 'Quarter identifier (e.g., q1-2025, q2-2025)'
        required: true
        type: string
      create_git_tag:
        description: 'Create git tag for this snapshot'
        required: false
        type: boolean
        default: true
      create_workspace_branches:
        description: 'Create workspace branches on Structurizr On-Premises'
        required: false
        type: boolean
        default: false

jobs:
  # ===========================================================================
  # Validate Quarter Format
  # ===========================================================================
  validate-input:
    name: Validate Input
    runs-on: [self-hosted, structurizr, nerdctl]
    steps:
      - name: Validate quarter format
        run: |
          if ! [[ "${{ inputs.quarter }}" =~ ^q[1-4]-[0-9]{4}$ ]]; then
            echo "ERROR: Invalid quarter format: ${{ inputs.quarter }}"
            echo "Expected format: qN-YYYY (e.g., q1-2025, q2-2025)"
            exit 1
          fi
          echo "Quarter format valid: ${{ inputs.quarter }}"

  # ===========================================================================
  # Discover and Validate Workspaces
  # ===========================================================================
  discover:
    name: Discover Workspaces
    needs: validate-input
    runs-on: [self-hosted, structurizr, nerdctl]
    outputs:
      domains: ${{ steps.find-workspaces.outputs.domains }}
      perspectives: ${{ steps.find-workspaces.outputs.perspectives }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find workspaces
        id: find-workspaces
        run: |
          domains=$(find workspaces/current/domains -name "workspace.dsl" -type f 2>/dev/null | \
            xargs -I {} dirname {} | \
            xargs -I {} basename {} | \
            jq -R -s -c 'split("\n") | map(select(length > 0))' || echo '[]')

          perspectives=$(find workspaces/current/perspectives -name "workspace.dsl" -type f 2>/dev/null | \
            xargs -I {} dirname {} | \
            xargs -I {} basename {} | \
            jq -R -s -c 'split("\n") | map(select(length > 0))' || echo '[]')

          echo "domains=$domains" >> $GITHUB_OUTPUT
          echo "perspectives=$perspectives" >> $GITHUB_OUTPUT
          echo "Discovered domains: $domains"
          echo "Discovered perspectives: $perspectives"

  validate:
    name: Validate ${{ matrix.workspace }}
    needs: discover
    runs-on: [self-hosted, structurizr, nerdctl]
    strategy:
      matrix:
        include:
          # Dynamically include both domains and perspectives
          - workspace: platform
            type: domain
          - workspace: orders
            type: domain
          - workspace: notifications
            type: domain
          - workspace: executive
            type: perspective
          - workspace: security
            type: perspective
          - workspace: technical
            type: perspective
      fail-fast: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate workspace
        env:
          JAVA_SSL_OPTS: "-Dcom.sun.net.ssl.checkRevocation=false -Djsse.enableSNIExtension=false"
        run: |
          TYPE_DIR="${{ matrix.type }}s"
          WORKSPACE_PATH="workspaces/current/${TYPE_DIR}/${{ matrix.workspace }}/workspace.dsl"

          if [ ! -f "$WORKSPACE_PATH" ]; then
            echo "Workspace not found, skipping: $WORKSPACE_PATH"
            exit 0
          fi

          echo "Validating ${{ matrix.workspace }} (${{ matrix.type }})..."
          nerdctl run --rm \
            -v "${{ github.workspace }}:/workspaces:ro" \
            -e JAVA_TOOL_OPTIONS="$JAVA_SSL_OPTS" \
            structurizr/cli:latest \
            validate \
            -workspace /workspaces/$WORKSPACE_PATH

  # ===========================================================================
  # Create Directory Snapshot
  # ===========================================================================
  create-snapshot:
    name: Create Directory Snapshot
    needs: [discover, validate]
    runs-on: [self-hosted, structurizr, nerdctl]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if directory exists
        id: check-dir
        run: |
          if [ -d "workspaces/${{ inputs.quarter }}" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "WARNING: Directory workspaces/${{ inputs.quarter }} already exists"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create quarter directory
        if: steps.check-dir.outputs.exists == 'false'
        run: |
          echo "Creating snapshot directory: workspaces/${{ inputs.quarter }}"

          # Resolve symlink and copy
          CURRENT_DIR=$(readlink -f workspaces/current)
          cp -r "$CURRENT_DIR" "workspaces/${{ inputs.quarter }}"

          # Remove Lite cache directories
          find "workspaces/${{ inputs.quarter }}" -name ".structurizr" -type d -exec rm -rf {} + 2>/dev/null || true

          # Remove temp files
          find "workspaces/${{ inputs.quarter }}" -name "*.dsl.dsl" -delete 2>/dev/null || true
          find "workspaces/${{ inputs.quarter }}" -name "*.dsl.json" -delete 2>/dev/null || true

          echo "Snapshot directory created"
          ls -la "workspaces/${{ inputs.quarter }}"

      - name: Commit snapshot directory
        if: steps.check-dir.outputs.exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add "workspaces/${{ inputs.quarter }}"
          git commit -m "chore: create quarterly snapshot ${{ inputs.quarter }}"
          git push

  # ===========================================================================
  # Create Git Tag
  # ===========================================================================
  create-tag:
    name: Create Git Tag
    needs: create-snapshot
    runs-on: [self-hosted, structurizr, nerdctl]
    if: ${{ inputs.create_git_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull latest changes
        run: git pull

      - name: Create and push tag
        run: |
          TAG_NAME="${{ inputs.quarter }}-final"

          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "WARNING: Tag $TAG_NAME already exists"
            exit 0
          fi

          echo "Creating git tag: $TAG_NAME"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag -a "$TAG_NAME" -m "Quarterly architecture snapshot: ${{ inputs.quarter }}"
          git push origin "$TAG_NAME"

          echo "Git tag created: $TAG_NAME"

  # ===========================================================================
  # Create Workspace Branches (Optional)
  # ===========================================================================
  create-branches:
    name: Create Branch - ${{ matrix.workspace }}
    needs: [discover, create-snapshot]
    if: ${{ inputs.create_workspace_branches }}
    runs-on: [self-hosted, structurizr, nerdctl]
    strategy:
      matrix:
        include:
          - workspace: platform
            type: domain
          - workspace: orders
            type: domain
          - workspace: notifications
            type: domain
          - workspace: executive
            type: perspective
          - workspace: security
            type: perspective
          - workspace: technical
            type: perspective
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get credentials
        id: creds
        run: |
          WORKSPACE_UPPER=$(echo "${{ matrix.workspace }}" | tr '[:lower:]-' '[:upper:]_')
          echo "workspace_upper=$WORKSPACE_UPPER" >> $GITHUB_OUTPUT

      - name: Create workspace branch
        env:
          JAVA_SSL_OPTS: "-Dcom.sun.net.ssl.checkRevocation=false -Djsse.enableSNIExtension=false"
        run: |
          TYPE_DIR="${{ matrix.type }}s"
          WORKSPACE_PATH="workspaces/current/${TYPE_DIR}/${{ matrix.workspace }}/workspace.dsl"

          if [ ! -f "$WORKSPACE_PATH" ]; then
            echo "Workspace not found, skipping: $WORKSPACE_PATH"
            exit 0
          fi

          echo "Creating branch '${{ inputs.quarter }}' for ${{ matrix.workspace }}..."
          nerdctl run --rm \
            -v "${{ github.workspace }}:/workspaces:ro" \
            -e JAVA_TOOL_OPTIONS="$JAVA_SSL_OPTS" \
            structurizr/cli:latest push \
            -url "${{ secrets.STRUCTURIZR_URL_INT }}" \
            -id "${{ secrets[format('STRUCTURIZR_{0}_WORKSPACE_ID', steps.creds.outputs.workspace_upper)] }}" \
            -key "${{ secrets[format('STRUCTURIZR_{0}_WORKSPACE_KEY_INT', steps.creds.outputs.workspace_upper)] }}" \
            -secret "${{ secrets[format('STRUCTURIZR_{0}_WORKSPACE_SECRET_INT', steps.creds.outputs.workspace_upper)] }}" \
            -branch "${{ inputs.quarter }}" \
            -workspace /workspaces/$WORKSPACE_PATH

  # ===========================================================================
  # Summary
  # ===========================================================================
  summary:
    name: Snapshot Summary
    needs: [discover, create-snapshot, create-tag, create-branches]
    if: always()
    runs-on: [self-hosted, structurizr, nerdctl]
    steps:
      - name: Print summary
        run: |
          echo "=============================================="
          echo "Quarterly Snapshot Complete: ${{ inputs.quarter }}"
          echo "=============================================="
          echo ""
          echo "Domains: ${{ needs.discover.outputs.domains }}"
          echo "Perspectives: ${{ needs.discover.outputs.perspectives }}"
          echo ""
          echo "Directory: workspaces/${{ inputs.quarter }}/"
          echo ""
          if [ "${{ inputs.create_git_tag }}" = "true" ]; then
            echo "Git Tag: ${{ inputs.quarter }}-final"
          fi
          echo ""
          echo "To access archived quarter:"
          echo "  CLI:     ./cli validate --quarter ${{ inputs.quarter }}"
          echo "  CLI:     ./cli promote --all --quarter ${{ inputs.quarter }}"
          echo "  Git:     git checkout ${{ inputs.quarter }}-final"
