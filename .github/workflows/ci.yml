# Structurizr CI - Validate DSL files on every push/PR
name: CI - Validate Workspaces

on:
  push:
    branches:
      - '**'
    paths:
      - 'workspaces/**/*.dsl'
      - '.github/workflows/ci.yml'
  pull_request:
    branches:
      - main
      - develop
    paths:
      - 'workspaces/**/*.dsl'
      - '.github/workflows/ci.yml'

jobs:
  # =============================================================================
  # Discover Domains
  # =============================================================================
  discover:
    name: Discover Domains
    runs-on: [self-hosted, structurizr, nerdctl]
    outputs:
      domains: ${{ steps.find-domains.outputs.domains }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find domain workspaces
        id: find-domains
        run: |
          # Discover all domains with workspace.dsl files
          domains=$(find workspaces/domains -name "workspace.dsl" -type f | \
            xargs -I {} dirname {} | \
            xargs -I {} basename {} | \
            jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "domains=$domains" >> $GITHUB_OUTPUT
          echo "Discovered domains: $domains"

  # =============================================================================
  # Validate Domains (Matrix Strategy)
  # =============================================================================
  validate:
    name: Validate ${{ matrix.domain }}
    needs: discover
    runs-on: [self-hosted, structurizr, nerdctl]
    strategy:
      matrix:
        domain: ${{ fromJson(needs.discover.outputs.domains) }}
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate ${{ matrix.domain }} workspace
        env:
          JAVA_SSL_OPTS: "-Dcom.sun.net.ssl.checkRevocation=false -Djsse.enableSNIExtension=false"
        run: |
          echo "Validating ${{ matrix.domain }} workspace..."
          nerdctl run --rm \
            -v "${{ github.workspace }}:/workspaces:ro" \
            -e JAVA_TOOL_OPTIONS="$JAVA_SSL_OPTS" \
            structurizr/cli:latest \
            validate \
            -workspace /workspaces/workspaces/domains/${{ matrix.domain }}/workspace.dsl

  # =============================================================================
  # Validation Summary
  # =============================================================================
  summary:
    name: Validation Summary
    needs: [discover, validate]
    runs-on: [self-hosted, structurizr, nerdctl]
    if: always()
    steps:
      - name: Validation summary
        run: |
          echo "======================================"
          echo "Validation Summary"
          echo "======================================"
          echo ""
          echo "Domains validated: ${{ needs.discover.outputs.domains }}"
          echo ""
          if [ "${{ needs.validate.result }}" = "success" ]; then
            echo "Result: All workspaces validated successfully!"
          else
            echo "Result: Some workspaces failed validation"
            exit 1
          fi
