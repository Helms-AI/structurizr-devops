# Structurizr On-Premises Configuration
# Documentation: https://docs.structurizr.com/onpremises/configuration

# =============================================================================
# URL Configuration
# =============================================================================
# The URL where Structurizr On-Premises will be accessible
structurizr.url=http://localhost:20000

# =============================================================================
# Authentication
# =============================================================================
# Authentication method: file (local users) or saml (SSO)
structurizr.authentication=file

# Admin username (for file-based auth)
structurizr.admin=structurizr

# =============================================================================
# Admin API Configuration
# =============================================================================
# The API key must be bcrypt encoded. Generate with:
#   ./scripts/generate-api-key.sh
#
# IMPORTANT: Replace this placeholder with a real bcrypt-encoded key!
# The plaintext key goes in your .env file, the bcrypt hash goes here.
#
# Example: If your plaintext key is "my-secret-admin-key", run:
#   htpasswd -nbBC 10 "" my-secret-admin-key | tr -d ':\n' | sed 's/$2y/$2a/'
#
# Default placeholder (CHANGE THIS!):
structurizr.apiKey=$2a$10$kUwVmrvyp8zz1ld2648lxOFSw6RbPb.iNyHx/GaS22/Sp59GOUGqy

# =============================================================================
# Feature Flags
# =============================================================================
# Enable the DSL editor in the UI
structurizr.feature.ui.dslEditor=true

# Enable diagram reviews
structurizr.feature.ui.reviews=true

# Workspace branches (disabled - using separate workspace IDs per workspace instead)
# Each workspace now has its own workspace ID rather than using branches
structurizr.feature.workspace.branches=false

# =============================================================================
# Data Storage
# =============================================================================
# Data directory (inside container)
structurizr.dataDirectory=/usr/local/structurizr/data

# =============================================================================
# Security
# =============================================================================
# Session timeout in minutes
structurizr.session.timeout=30

# HTTPS redirect (disable for local dev behind reverse proxy)
structurizr.https=false
